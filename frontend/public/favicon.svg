<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="OAuth Guides">
  <defs>
    <pattern id="wait" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="7" height="7" fill="#303030" />
      <rect width="3.5" height="7" fill="#4a4a4a" />
    </pattern>
  </defs>
  <rect width="64" height="64" rx="15" fill="#111111" />
  <rect x="1.5" y="1.5" width="61" height="61" rx="13.5" fill="none" stroke="#444444" stroke-width="3" />
  <!-- the journey: agent, you, then the wait -->
  <rect x="8" y="16" width="12" height="32" rx="5" fill="#e9b3ff" />
  <rect x="23" y="16" width="12" height="32" rx="5" fill="#4d5dff" />
  <rect x="38" y="16" width="18" height="32" rx="5" fill="url(#wait)" stroke="#8a8a8a" stroke-width="2" />
</svg>
